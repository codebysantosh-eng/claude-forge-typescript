# Claude Forge — Kit Validation
# Runs on this repo to verify hooks, scripts, and file structure are correct.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Verify required files exist
        run: |
          MISSING=0
          for f in CLAUDE.md README.md install.sh uninstall.sh hooks/hooks.json hooks/hooks.json hooks/build.js hooks/README.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All required files present"

      - name: Verify all agents have frontmatter
        run: |
          FAIL=0
          for f in agents/*.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "::error::Missing YAML frontmatter: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All agents have frontmatter"

      - name: Verify all commands have frontmatter
        run: |
          FAIL=0
          for f in commands/*.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "::error::Missing frontmatter: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All commands have frontmatter"

      - name: Verify hooks.json is valid JSON
        run: jq empty hooks/hooks.json && echo "hooks.json is valid JSON"

      - name: Verify hooks.json is in sync with scripts
        run: |
          cp hooks/hooks.json hooks/hooks.json.bak
          node hooks/build.js
          if ! diff -q hooks/hooks.json hooks/hooks.json.bak > /dev/null 2>&1; then
            echo "::error::hooks.json is out of sync with hooks/scripts/. Run 'node hooks/build.js' and commit the result."
            diff hooks/hooks.json.bak hooks/hooks.json || true
            rm hooks/hooks.json.bak
            exit 1
          fi
          rm hooks/hooks.json.bak
          echo "hooks.json is in sync with scripts"

      - name: Verify every hook has a script file
        run: |
          FAIL=0
          for id in $(jq -r '.hooks | to_entries[] | .value[] | .id' hooks/hooks.json); do
            if [ ! -f "hooks/scripts/${id}.js" ]; then
              echo "::error::Missing script for hook '${id}': hooks/scripts/${id}.js"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All hooks have corresponding script files"

      - name: Run hook integration tests
        run: ./hooks/tests/run-tests.sh

      - name: Validate agent-command mapping
        run: |
          FAIL=0
          # Parse CLAUDE.md agent-command table — skip header, separator, and *(none)* rows
          while IFS='|' read -r _ agent cmd _rest; do
            agent=$(echo "$agent" | tr -d ' ')
            cmd=$(echo "$cmd" | tr -d ' `/\\')
            # Skip empty, header, separator, and agent-less rows
            [ -z "$agent" ] && continue
            [[ "$agent" == "Agent" ]] && continue
            [[ "$agent" == *"---"* ]] && continue
            [[ "$agent" == *"(none)"* ]] && continue
            if [ ! -f "agents/${agent}.md" ]; then
              echo "::error::Agent file missing: agents/${agent}.md (mapped from command /${cmd})"
              FAIL=1
            fi
            if [ ! -f "commands/${cmd}.md" ]; then
              echo "::error::Command file missing: commands/${cmd}.md (mapped from agent ${agent})"
              FAIL=1
            fi
          done < <(grep '|' CLAUDE.md | grep -v '^\s*#')
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "Agent-command mapping is valid"

      - name: Verify scripts are executable
        run: |
          for f in install.sh uninstall.sh hooks/tests/run-tests.sh; do
            if [ ! -x "$f" ]; then
              echo "::error::Not executable: $f"
              exit 1
            fi
          done
          echo "All scripts are executable"

      - name: Count inventory
        run: |
          echo "Agents:   $(ls agents/*.md | wc -l | tr -d ' ')"
          echo "Commands: $(ls commands/*.md | wc -l | tr -d ' ')"
          echo "Skills:   $(ls -d skills/*/ | wc -l | tr -d ' ')"
          echo "Rules:    $(ls rules/*.md | wc -l | tr -d ' ')"
          echo "Hooks:    $(jq '[.hooks | to_entries[] | .value | length] | add' hooks/hooks.json)"
          echo "Scripts:  $(ls hooks/scripts/*.js | wc -l | tr -d ' ')"
