# Claude Forge — Kit Validation
# Runs on this repo to verify hooks, scripts, and file structure are correct.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Verify required files exist
        run: |
          MISSING=0
          for f in CLAUDE.md README.md install.sh uninstall.sh hooks/hooks.json hooks/README.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All required files present"

      - name: Verify all agents have frontmatter
        run: |
          FAIL=0
          for f in agents/*.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "::error::Missing YAML frontmatter: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All agents have frontmatter"

      - name: Verify all commands have frontmatter
        run: |
          FAIL=0
          for f in commands/*.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "::error::Missing frontmatter: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All commands have frontmatter"

      - name: Verify hooks.json is valid JSON
        run: jq empty hooks/hooks.json && echo "hooks.json is valid JSON"

      - name: Run hook integration tests
        run: ./hooks/tests/run-tests.sh

      - name: Verify scripts are executable
        run: |
          for f in install.sh uninstall.sh hooks/tests/run-tests.sh; do
            if [ ! -x "$f" ]; then
              echo "::error::Not executable: $f"
              exit 1
            fi
          done
          echo "All scripts are executable"

      - name: Count inventory
        run: |
          echo "Agents:   $(ls agents/*.md | wc -l | tr -d ' ')"
          echo "Commands: $(ls commands/*.md | wc -l | tr -d ' ')"
          echo "Skills:   $(ls -d skills/*/ | wc -l | tr -d ' ')"
          echo "Rules:    $(ls rules/*.md | wc -l | tr -d ' ')"
          echo "Hooks:    $(jq '[.hooks | to_entries[] | .value | length] | add' hooks/hooks.json)"
