# Claude Forge — CI Pipeline Template
# Copy this to your project's .github/workflows/ci.yml
#
# Maps to /healthcheck: types → build → lint → format → tests → secrets → audit
# Covers: TypeScript, Next.js, Prisma, Vitest/Jest, Playwright

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─── Step 1-4: Type check, build, lint, format ───
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4 — pinned to SHA
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      # Prisma: generate client if schema exists
      - name: Generate Prisma client
        run: npx prisma generate 2>/dev/null || true

      # Step 1: Type check
      - name: Type check
        run: npx tsc --noEmit

      # Step 2: Build
      - name: Build
        run: npm run build

      # Step 3: Lint
      - name: Lint
        run: npm run lint

      # Step 4: Format check
      - name: Format check
        run: npx prettier --check . 2>/dev/null || echo "Prettier not configured — skipping"

  # ─── Step 5: Unit & integration tests ───
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npx prisma generate 2>/dev/null || true

      # Run tests with coverage
      - name: Run tests
        run: npm test -- --coverage 2>/dev/null || npm test

      # Upload coverage (optional — uncomment if using Codecov)
      # - uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Step 6-7: Security checks ───
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Step 6: Secrets scan
      - name: Scan for hardcoded secrets
        run: |
          FOUND=0
          # Hardcoded secrets pattern
          if grep -rn '\b\(api[_-]\?key\|secret[_-]\?key\|password\|credentials\|private[_-]\?key\|client[_-]\?secret\)\b\s*[:=]\s*["'"'"'`][^"'"'"'`\s]\{8,\}' \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" \
            src/ lib/ app/ 2>/dev/null; then
            echo "::error::Possible hardcoded secrets found"
            FOUND=1
          fi
          # Known secret prefixes
          if grep -rn 'sk_live_\|ghp_\|gho_\|github_pat_\|xoxb-\|xoxp-\|AKIA[0-9A-Z]\{16\}' \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" \
            src/ lib/ app/ 2>/dev/null; then
            echo "::error::Known secret prefix found in source code"
            FOUND=1
          fi
          # NEXT_PUBLIC_ on server secrets
          if grep -rn 'NEXT_PUBLIC_.*\(SECRET\|PASSWORD\|PRIVATE_KEY\|TOKEN\|CREDENTIAL\)' \
            --include="*.ts" --include="*.tsx" --include="*.env*" \
            src/ lib/ app/ 2>/dev/null; then
            echo "::error::NEXT_PUBLIC_ prefix on server secret"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No secrets found"

      # Step 7: Dependency audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --production --audit-level=critical

